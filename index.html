<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sunrise on the Reaping Countdown</title>
<meta name="description" content="A live countdown to Sunrise on the Reaping." />
<meta name="theme-color" content="#05060a" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#05060a;
    --text:#ffffff;
    --text-dim:rgba(255,255,255,.58);
    --accent:#ffb86b;
    --accent-2:#ff7e5f;
    --card-bg:rgba(255,255,255,.055);
    --card-line:rgba(255,255,255,.13);
    --sun-y:82%;
    --glow-opacity:.75;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .sr-only{
    position:absolute; width:1px; height:1px;
    clip-path:inset(50%); overflow:hidden; white-space:nowrap;
  }

  /* ---------- BACKGROUND: soft modern sunrise, kept low ---------- */
  .glow{
    position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .glow::before{ /* main sunrise wash, anchored to the bottom */
    content:""; position:absolute; left:50%; bottom:-38vmax;
    width:110vmax; height:110vmax; transform:translateX(-50%);
    background:radial-gradient(circle,
      rgba(255,184,107,.50) 0%,
      rgba(255,126,95,.34) 30%,
      rgba(178,75,133,.20) 52%,
      rgba(5,6,10,0) 70%);
    opacity:var(--glow-opacity);
    animation:breathe 11s ease-in-out infinite alternate;
    will-change:transform,opacity;
  }
  .glow::after{ /* cool upper wash so the top stays dark and readable */
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(80% 55% at 82% -10%, rgba(84,92,180,.20), rgba(5,6,10,0) 60%),
      linear-gradient(to bottom, rgba(3,4,8,.72) 0%, rgba(3,4,8,0) 34%);
  }
  @keyframes breathe{
    from{transform:translateX(-50%) scale(1)}
    to  {transform:translateX(-50%) scale(1.045)}
  }

  /* the sun itself: a soft orb low on the horizon, never behind the title */
  .sun{
    position:fixed; left:50%; top:var(--sun-y); z-index:1;
    width:min(46vmin,420px); aspect-ratio:1; border-radius:50%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at 50% 38%,
      #fff3d6 0%, #ffd9a0 34%, #ffb86b 58%, #ff7e5f 82%, rgba(255,126,95,.9) 100%);
    box-shadow:
      0 0 80px rgba(255,160,90,.55),
      0 0 220px rgba(255,126,95,.38);
    filter:saturate(1.05);
    transition:top 1.4s cubic-bezier(.22,1,.36,1);
    pointer-events:none;
  }
  body.arrived{--sun-y:58%; --glow-opacity:1}
  body.arrived .sun{
    box-shadow:0 0 110px rgba(255,175,100,.8), 0 0 300px rgba(255,126,95,.5);
  }

  /* smooth minimal hills */
  .hills{position:fixed; left:0; right:0; bottom:0; z-index:2; line-height:0; pointer-events:none}
  .hills svg{display:block; width:100%; height:auto}

  #embers{position:fixed; inset:0; z-index:3; pointer-events:none}
  .fade-bottom{
    position:fixed; inset:0; z-index:4; pointer-events:none;
    background:linear-gradient(to top, rgba(3,4,8,.5), rgba(3,4,8,0) 26%);
  }

  /* ---------- CONTENT ---------- */
  main{
    position:relative; z-index:10;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:32px 20px clamp(110px,20vh,190px);
  }
  .eyebrow{
    display:inline-flex; align-items:center; gap:.6em;
    font-size:clamp(.68rem,1.4vw,.8rem);
    font-weight:600;
    letter-spacing:.34em; text-indent:.1em;
    text-transform:uppercase;
    color:var(--accent);
    animation:in 1s cubic-bezier(.22,1,.36,1) .1s both;
  }
  .eyebrow::before{
    content:""; width:7px; height:7px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 12px rgba(255,184,107,.9);
    animation:dot 2.6s ease-in-out infinite;
  }
  @keyframes dot{0%,100%{opacity:1}50%{opacity:.35}}
  h1{
    font-family:"Sora",sans-serif;
    font-weight:800;
    font-size:clamp(2.3rem,6.8vw,4.9rem);
    line-height:1.04;
    letter-spacing:-.025em;
    margin-top:.38em;
    color:#fff;
    text-shadow:0 2px 34px rgba(0,0,0,.55);
    animation:in 1s cubic-bezier(.22,1,.36,1) .22s both;
  }
  h1 .thin{display:block; font-weight:600; color:rgba(255,255,255,.92)}
  @keyframes in{from{opacity:0; transform:translateY(26px)} to{opacity:1; transform:translateY(0)}}

  /* ---------- COUNTDOWN ---------- */
  .countdown{
    display:flex; gap:clamp(10px,2vw,22px);
    margin-top:clamp(38px,7vh,68px);
    animation:in 1s cubic-bezier(.22,1,.36,1) .38s both;
  }
  .unit{
    width:clamp(76px,17.5vw,164px);
    padding:clamp(18px,3.4vh,30px) 6px clamp(15px,2.6vh,24px);
    background:var(--card-bg);
    border:1px solid var(--card-line);
    border-radius:24px;
    backdrop-filter:blur(22px) saturate(1.4);
    -webkit-backdrop-filter:blur(22px) saturate(1.4);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.14),
      0 24px 48px rgba(0,0,0,.38);
  }
  /* Rolling digits: each digit is a strip of 0-9 that glides to the
     current number with a long ease-out — no flips, no flashes. */
  .value{
    display:flex; justify-content:center;
    font-family:"Sora",sans-serif;
    font-size:clamp(2.6rem,9.5vw,5.4rem);
    font-weight:700;
    line-height:1;
    font-variant-numeric:tabular-nums;
    color:#fff;
  }
  .roller{height:1em; overflow:hidden}
  .strip{
    display:flex; flex-direction:column;
    transition:transform .65s cubic-bezier(.22,1,.36,1);
    will-change:transform;
  }
  .strip span{
    height:1em; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .strip.no-anim{transition:none}
  .label{
    margin-top:clamp(9px,1.7vh,15px);
    font-size:clamp(.6rem,1.5vw,.75rem);
    font-weight:600;
    letter-spacing:.32em; text-indent:.32em;
    text-transform:uppercase;
    color:var(--text-dim);
  }
  body.arrived .value{color:var(--accent)}

  @media (max-width:420px){
    .countdown{gap:8px}
    .unit{border-radius:18px}
    .label{letter-spacing:.22em; text-indent:.22em}
  }
  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important}
  }
</style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <div class="sun" aria-hidden="true"></div>

  <div class="hills" aria-hidden="true">
    <svg viewBox="0 0 1440 170" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0,84 C240,44 420,104 720,78 C1020,52 1200,96 1440,62 L1440,170 L0,170 Z" fill="#0a0710" opacity="0.66"/>
      <path d="M0,120 C260,84 520,132 820,108 C1080,88 1260,120 1440,100 L1440,170 L0,170 Z" fill="#060410" opacity="0.92"/>
      <path d="M0,148 C300,122 640,156 960,136 C1160,124 1320,142 1440,132 L1440,170 L0,170 Z" fill="#030308"/>
    </svg>
  </div>

  <canvas id="embers" aria-hidden="true"></canvas>
  <div class="fade-bottom" aria-hidden="true"></div>

  <main>
    <p class="eyebrow">Countdown</p>
    <h1>Sunrise on the Reaping</h1>

    <div class="countdown" role="timer" aria-label="Time remaining until Sunrise on the Reaping">
      <div class="unit">
        <div class="value" id="days" aria-hidden="true"></div>
        <div class="label">Days</div>
      </div>
      <div class="unit">
        <div class="value" id="hours" aria-hidden="true"></div>
        <div class="label">Hours</div>
      </div>
      <div class="unit">
        <div class="value" id="minutes" aria-hidden="true"></div>
        <div class="label">Minutes</div>
      </div>
      <div class="unit">
        <div class="value" id="seconds" aria-hidden="true"></div>
        <div class="label">Seconds</div>
      </div>
    </div>
    <p class="sr-only" id="srStatus"></p>
  </main>

<script>
(function () {
  "use strict";

  /*
   * TARGET — read this before ever changing it.
   * 10:00 p.m. on Friday, November 20, 2026 in British Columbia.
   * B.C. adopted permanent daylight time on Nov 1, 2026: Pacific Time (PCT)
   * is now fixed at UTC-7 all year, with no fall-back.
   * The instant is pinned in UTC on purpose. Using "America/Vancouver"
   * would be wrong on any device whose timezone data still follows the
   * old rules and falls back to UTC-8 — that would land an hour late.
   *   Nov 20, 2026 22:00 at UTC-7  ==  Nov 21, 2026 05:00 UTC
   */
  var TARGET = Date.UTC(2026, 10, 21, 5, 0, 0);

  /* Build a two-digit rolling counter inside an element:
     two strips of 0-9 that glide vertically to the right digit. */
  function makeCounter(el) {
    var strips = [];
    for (var d = 0; d < 2; d++) {
      var roller = document.createElement("div");
      roller.className = "roller";
      var strip = document.createElement("div");
      strip.className = "strip no-anim";
      for (var n = 0; n < 10; n++) {
        var s = document.createElement("span");
        s.textContent = n;
        strip.appendChild(s);
      }
      roller.appendChild(strip);
      el.appendChild(roller);
      strips.push(strip);
    }
    /* enable transitions on the next frame, so the first set doesn't glide */
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        strips.forEach(function (st) { st.classList.remove("no-anim"); });
      });
    });
    var current = -1;
    return {
      set: function (value) {
        if (value === current) return;
        current = value;
        var tens = Math.floor(value / 10) % 10;
        var ones = value % 10;
        strips[0].style.transform = "translateY(-" + tens + "em)";
        strips[1].style.transform = "translateY(-" + ones + "em)";
      }
    };
  }

  var counters = {
    days:    makeCounter(document.getElementById("days")),
    hours:   makeCounter(document.getElementById("hours")),
    minutes: makeCounter(document.getElementById("minutes")),
    seconds: makeCounter(document.getElementById("seconds"))
  };
  var srStatus = document.getElementById("srStatus");
  var DAY = 86400000, HOUR = 3600000, MIN = 60000;
  var lastSrMinute = -1;

  function update() {
    var diff = TARGET - Date.now();

    if (diff <= 0) {
      counters.days.set(0);
      counters.hours.set(0);
      counters.minutes.set(0);
      counters.seconds.set(0);
      document.body.classList.add("arrived"); /* the sun fully rises */
      document.title = "Sunrise on the Reaping";
      srStatus.textContent = "The countdown has finished.";
      return false;
    }

    var d = Math.floor(diff / DAY);
    var h = Math.floor(diff % DAY / HOUR);
    var m = Math.floor(diff % HOUR / MIN);
    var s = Math.floor(diff % MIN / 1000);
    counters.days.set(d);
    counters.hours.set(h);
    counters.minutes.set(m);
    counters.seconds.set(s);

    if (m !== lastSrMinute) {
      lastSrMinute = m;
      srStatus.textContent = d + " days, " + h + " hours, " + m + " minutes remaining.";
    }

    /* The sun climbs as the moment approaches: across the final 24 hours
       it eases up from the horizon. The CSS transition smooths each step. */
    var progress = Math.min(1, Math.max(0, 1 - diff / DAY));
    document.documentElement.style.setProperty("--sun-y", (82 - progress * 20) + "%");
    document.documentElement.style.setProperty("--glow-opacity", (0.75 + progress * 0.25).toFixed(3));
    return true;
  }

  /* Tick on the wall-clock second boundary, self-correcting for drift. */
  function loop() {
    if (!update()) return;
    setTimeout(loop, 1000 - (Date.now() % 1000) + 20);
  }
  loop();

  /* ---------------- Soft drifting embers ---------------- */
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  var canvas = document.getElementById("embers");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
  var COUNT = Math.min(42, Math.max(20, Math.floor(window.innerWidth / 34)));
  var embers = [];

  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  function spawn(seed) {
    return {
      x: Math.random() * W,
      y: seed ? Math.random() * H : H + 10,
      r: 0.6 + Math.random() * 1.5,
      vy: 0.16 + Math.random() * 0.42,
      phase: Math.random() * Math.PI * 2,
      swaySpeed: 0.0006 + Math.random() * 0.0011,
      swaySize: 12 + Math.random() * 20,
      hue: 24 + Math.random() * 22,
      alpha: 0.22 + Math.random() * 0.4
    };
  }
  resize();
  for (var i = 0; i < COUNT; i++) embers.push(spawn(true));
  window.addEventListener("resize", resize, { passive: true });

  (function draw(t) {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < embers.length; i++) {
      var e = embers[i];
      e.y -= e.vy;
      var x = e.x + Math.sin(t * e.swaySpeed + e.phase) * e.swaySize * 0.4;
      var flicker = 0.78 + Math.sin(t * 0.0022 + e.phase * 3) * 0.22;
      ctx.beginPath();
      ctx.arc(x, e.y, e.r, 0, Math.PI * 2);
      ctx.fillStyle = "hsla(" + e.hue + ", 100%, 66%, " + (e.alpha * flicker) + ")";
      ctx.fill();
      if (e.y < -12) embers[i] = spawn(false);
    }
    requestAnimationFrame(draw);
  })(0);
})();
</script>
</body>
</html>
